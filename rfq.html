<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shunah | Request RFQ</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    html { scroll-behavior: smooth; }

    .rfqField{
      width:100%;
      border:1px solid rgba(11,26,45,0.15);
      padding:12px 14px;
      border-radius:10px;
      outline:none;
      background:white;
      color:#0b1a2d;
      transition:border-color 200ms ease, box-shadow 200ms ease;
    }

    .rfqField:focus{
      border-color:#0b1a2d;
      box-shadow:0 0 0 2px rgba(11,26,45,0.08);
    }

    .rfqFieldWithIcon{
      padding-left:44px;
      padding-right:42px;
      appearance:none;
      -webkit-appearance:none;
      -moz-appearance:none;
    }

    .rfqFieldIconWrap{
      position:relative;
      width:100%;
    }

    .rfqFieldLeftIcon{
      position:absolute;
      left:14px;
      top:50%;
      transform:translateY(-50%);
      width:26px;
      height:26px;
      color:#5b84d7;
      pointer-events:none;
    }

    .rfqFieldRightChevron{
      position:absolute;
      right:14px;
      top:50%;
      transform:translateY(-50%);
      width:18px;
      height:18px;
      color:#0b1a2d;
      pointer-events:none;
    }

    .tCircleWrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      position:relative;
      z-index:2;
      user-select:none;
overflow:visible;
    }


    .tCircle{
      width:56px;
      height:56px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      font-size:15px;
      background:#e5e7eb;
      border:2px solid #ffffff;
      color:#0b1a2d;
      cursor:pointer;
      transition:
    transform 250ms ease,
    box-shadow 250ms ease,
    background 200ms ease;
    }

    .tCircleWrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      position:relative;
      z-index:2;
      user-select:none;
      padding-top:14px;
    }

.tCircle{
  position:relative; /* ADD THIS */
}
   .tCircleMark{
  position:absolute;
  top:14px;
  right:-4px;   /* move to upper-right */
  left:auto;
  transform:none;
 z-index:5;
  width:18px;
  height:18px;
  border-radius:999px;

  background:#22c55e;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:11px;
  font-weight:900;
  line-height:1;

  border:2px solid #ffffff;   /* white border */
  box-shadow:0 4px 10px rgba(34,197,94,.25);

  opacity:0;
  pointer-events:none;
  transition:all .2s ease;
}

    .tCircleMark.show{
      opacity:1;
    }

    .tCircleMark.warn{
      background:#22c55e;
      color:#fff;
    }
    .tCircle.done{
      background:#22c55e;
      color:white;
    }

   .tCircle.active{
  background:#2F5DA8;              /* Shunah blue */
  color:white;

  border:3px solid #ffffff;       /* clean white ring */

  box-shadow:
    0 0 0 4px rgba(47,93,168,0.15),   /* soft outer ring */
    0 10px 25px rgba(47,93,168,0.35); /* glow depth */

  transform:scale(1.08);          /* slight premium pop */
}

    .tLabel{
      font-size:9px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:rgba(11,26,45,.55);
      transition:opacity 350ms ease,transform 350ms ease;
      text-align:center;
      line-height:1.1;
      min-height:22px;
    }
.tLabel.activeLabel{
  color:#0b1a2d;
  font-weight:700;
}
    .tLabel.hiddenLabel{
      opacity:1;
      transform:translateY(-4px);
      pointer-events:none;
    }

  

    /* Mobile compact tracker */
    .mTrackerOuter{
      width:100%;
    }

    .mTrackerRow{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }

    .mArrow{
      width:32px;
      height:32px;
      min-width:32px;
      border-radius:999px;
      border:1px solid rgba(11,26,45,0.08);
      background:#f3f4f6;
      color:#6b7280;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      font-weight:700;
      transition:all .2s ease;
    }

    .mArrow:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .mSteps{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }

    .mStepBubble{
      width:34px;
      height:34px;
      min-width:34px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      font-weight:700;
      background:#e5e7eb;
      color:#6b7280;
      border:none;
      transition:all .2s ease;
    }

    .mStepBubble.active{
      background:#0b1a2d;
      color:#fff;
      box-shadow:0 8px 18px rgba(11,26,45,.18);
    }

    .mStepBubble.done{
      background:#dbe7ff;
      color:#2F5DA8;
    }

    .mStepEllipsis{
      width:24px;
      min-width:24px;
      text-align:center;
      color:#6b7280;
      font-size:18px;
      line-height:1;
      transform:translateY(-1px);
    }

    .mStepLabel{
      margin-top:10px;
      text-align:center;
      font-size:11px;
      line-height:1.1;
      letter-spacing:.10em;
      text-transform:uppercase;
      color:#0b1a2d;
      font-weight:700;
    }

    .reviewItem{
      border:1px solid rgba(11,26,45,0.08);
      border-radius:14px;
      padding:14px 15px;
      background:white;
    }

    .reviewLabel{
      font-size:12px;
      line-height:1;
      color:rgba(11,26,45,.50);
    }

    .reviewValue{
      margin-top:8px;
      font-size:14px;
      line-height:1.35;
      font-weight:600;
      color:#0b1a2d;
      word-break:break-word;
    }

    .reviewCheck{
      display:flex;
      align-items:flex-start;
      gap:10px;
      border:1px solid rgba(47,93,168,0.10);
      background:#f7faff;
      border-radius:14px;
      padding:14px;
    }

    .reviewCheckIcon{
      width:18px;
      height:18px;
      color:#2F5DA8;
      flex:0 0 auto;
      margin-top:1px;
    }

    @media (min-width: 768px){
      #rfqTrackerWrapMobile{
        display:none !important;
      }
    }
  </style>
</head>

  <section id="rfq" class="bg-white">

           <img src="rfq/left.png" alt="RFQ visual" class="w-full h-full object-cover pointer-events-none select-none" />
            <div class="absolute inset-0 bg-black/5"></div>

        <!-- RIGHT CONTENT -->
        <div class="lg:col-span-8">
<div class="max-w-2xl ml-auto">

  Request RFQ
</h2>

<p id="rfqSubtitle"
   class="mt-2 text-sm tracking-[0.12em] uppercase text-[#2F5DA8] font-medium">

            <!-- STEP 0 -->
           <div id="rfqStep0Card"
     class="mt-6 rounded-2xl border border-black/10 bg-white p-6 sm:p-7 shadow-[0_25px_70px_rgba(11,26,45,0.15),0_5px_20px_rgba(11,26,45,0.08)]">

  <script>
    (function(){
      const steps = [
  { key:"crop", label:"Crop", title:"Buyer Choose Crop", subtitle:"Select the crop you want to purchase.", type:"select", icon:"crop", options:["White Beans","Sesame","Fava Beans","Rice","Caraway","Fennel"]},
  { key:"spec", label:"Spec", title:"SKU / Specification", subtitle:"Choose the SKU specification.", type:"select", icon:"spec", options:["WKB-001 (Standard)","WKB-002 (Premium)","SSM-001 (Standard)","SSM-002 (Premium)","RCE-001 (Standard)"]},
  { key:"containers", label:"Tons", title:"Number of Containers", subtitle:"Enter the number of containers.", type:"number", icon:"tons", placeholder:"e.g. 4" },
  { key:"packing", label:"Packing", title:"Packing", subtitle:"Choose packing format.", type:"select", icon:"packing", options:["25kg PP Bags","50kg PP Bags","Jumbo Bags","Bulk"]},
  { key:"destination", label:"Destination", title:"Destination", subtitle:"Where should the shipment be delivered?", type:"text", icon:"destination", placeholder:"Country / City" },
  { key:"delivery", label:"Delivery", title:"Expected Delivery Date", subtitle:"Choose your expected delivery date.", type:"date", icon:"delivery" },
  { key:"quality", label:"Quality", title:"Quality Inspection", subtitle:"Select inspection method.", type:"select", icon:"quality", options:["Shunah QC","Third-Party Inspection","Buyer Inspection"]},
  { key:"insurance", label:"Insurance", title:"Insurance", subtitle:"Select insurance option.", type:"select", icon:"insurance", options:["Included","Optional","Not Required"]},
  { key:"paymentTerms", label:"Payment", title:"Payment Terms", subtitle:"Choose your preferred payment terms.", type:"select", icon:"payment", options:["Advance Payment","30% Advance / 70% Before Shipment","Letter of Credit (L/C)","CAD","Open Account"]},
  { key:"review", label:"Review", title:"Review & Confirm", subtitle:"Please review your request details before submitting.", type:"review" }
];

      const state = {};
      let current = 0;
      const completed = new Set();
      let finalSubmitted = false;

      const step0Card = document.getElementById("rfqStep0Card");
      const wizardWrap = document.getElementById("rfqWizardWrap");

      const nameEl = document.getElementById("rfqName");
      const emailEl = document.getElementById("rfqEmail");
      const phoneEl = document.getElementById("rfqPhone");
      const startBtn = document.getElementById("rfqStart");

      const tracker = document.getElementById("rfqTracker");
      const mobileTracker = document.getElementById("rfqMobileTracker");

      const stepTitle = document.getElementById("rfqStepTitle");
      const stepSubtitle = document.getElementById("rfqStepSubtitle");
      const stepBody = document.getElementById("rfqStepBody");

const stepIcon = document.getElementById("rfqStepIcon");


      const backBtn = document.getElementById("rfqBack");
      const nextBtn = document.getElementById("rfqNext");
      const submitWrap = document.getElementById("rfqSubmitWrap");
      const submitBtn = document.getElementById("rfqSubmit");
      const finalMsg = document.getElementById("rfqFinalMsg");

      function iconSvg(type){
        const map = {
          crop: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 21V11"/><path d="M8 17c-2.5 0-4.5-2-4.5-4.5C6 12.5 8 14.5 8 17Z"/><path d="M16 17c2.5 0 4.5-2 4.5-4.5C18 12.5 16 14.5 16 17Z"/><path d="M8 11C5.5 11 3.5 9 3.5 6.5 6 6.5 8 8.5 8 11Z"/><path d="M16 11c2.5 0 4.5-2 4.5-4.5C18 6.5 16 8.5 16 11Z"/></svg>`,
          spec: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 12h8M8 15h5"/></svg>`,
          tons: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M7 7h10l-1 10H8L7 7Z"/><path d="M9 7a3 3 0 1 1 6 0"/></svg>`,
          packing: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3l8 4.5-8 4.5-8-4.5L12 3Z"/><path d="M4 7.5V16.5L12 21l8-4.5V7.5"/><path d="M12 12v9"/></svg>`,
          destination: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 21s6-5.4 6-11a6 6 0 1 0-12 0c0 5.6 6 11 6 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>`,
          delivery: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>`,
          quality: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg>`,
          insurance: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z"/><path d="M9 12h6"/></svg>`,
payment: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/><path d="M7 15h3"/></svg>`,          
chevron: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="m6 9 6 6 6-6"/></svg>`,
          check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>`
        };
        return map[type] || map.spec;
      }

      function buildSelectField(step){
        const wrap = document.createElement("div");
        wrap.className = "rfqFieldIconWrap";

        const leftIcon = document.createElement("div");
        leftIcon.className = "rfqFieldLeftIcon";
        leftIcon.innerHTML = iconSvg(step.icon || "spec");

        const sel = document.createElement("select");
        sel.className = "rfqField rfqFieldWithIcon";
        sel.innerHTML =
          `<option value="">Select...</option>` +
          (step.options || []).map(o => `<option value="${o}">${o}</option>`).join("");
        sel.value = state[step.key] || "";
        sel.addEventListener("change", ()=> state[step.key] = sel.value);

        const rightChevron = document.createElement("div");
        rightChevron.className = "rfqFieldRightChevron";
        rightChevron.innerHTML = iconSvg("chevron");

        wrap.appendChild(leftIcon);
        wrap.appendChild(sel);
        wrap.appendChild(rightChevron);

        return wrap;
      }

      function buildInputField(step){
        const wrap = document.createElement("div");
        wrap.className = "rfqFieldIconWrap";

        const leftIcon = document.createElement("div");
        leftIcon.className = "rfqFieldLeftIcon";
        leftIcon.innerHTML = iconSvg(step.icon || "spec");

        const input = document.createElement("input");
        input.type = step.type || "text";
        input.placeholder = step.placeholder || "";
        input.className = "rfqField rfqFieldWithIcon";
        input.value = state[step.key] || "";
        input.addEventListener("input", ()=> state[step.key] = input.value);

        wrap.appendChild(leftIcon);
        wrap.appendChild(input);

        if(step.type !== "date"){
          const rightChevron = document.createElement("div");
          rightChevron.className = "rfqFieldRightChevron";
          rightChevron.style.opacity = ".0";
          wrap.appendChild(rightChevron);
        }

        if(step.key === "containers"){
          const note = document.createElement("div");
          note.className = "mt-2 text-xs text-[#0b1a2d]/55";
          note.textContent = "* A container is typically between 24–25 tons.";
          const outer = document.createElement("div");
          outer.appendChild(wrap);
          outer.appendChild(note);
          return outer;
        }

        return wrap;
      }

      function reviewValue(v){
        if(v === undefined || v === null || String(v).trim() === "") return "—";
        return String(v);
      }

function buildReviewStep(){
  const outer = document.createElement("div");
  outer.className = "space-y-2";

  const qualityYes =
    state.quality && String(state.quality).trim().toLowerCase() !== "no";

  const insuranceYes =
    state.insurance && String(state.insurance).trim().toLowerCase() !== "no";

  let otherText = "No";
  if(qualityYes && insuranceYes){
    otherText = "Quality Inspection | Insurance";
  } else if(qualityYes){
    otherText = "Quality Inspection";
  } else if(insuranceYes){
    otherText = "Insurance";
  }

  const lines = [
    {
      label: "Basic:",
      value: `${reviewValue(state.__name)} | ${reviewValue(state.__email)} | ${reviewValue(state.__phone)}`
    },
    {
      label: "Order:",
      value: `${reviewValue(state.crop)} | ${reviewValue(state.spec)} | ${reviewValue(state.containers)} Container | ${reviewValue(state.packing)}`
    },
    {
      label: "Destination:",
      value: `${reviewValue(state.destination)} | ${reviewValue(state.delivery)}`
    },
    {
      label: "Other:",
      value: otherText
    },
    {
      label: "Payment Terms:",
      value: `${reviewValue(state.paymentTerms)}`
    }
  ];

  lines.forEach((line) => {
    const row = document.createElement("div");
    row.className = "text-sm leading-relaxed";

    row.innerHTML = `
      <span class="font-semibold text-[#2F5DA8]">${line.label}</span>
      <span class="text-[#0b1a2d]">${line.value}</span>
    `;

    outer.appendChild(row);
  });

  return outer;
}
           function makeField(step){
        if(step.type === "review"){
          return buildReviewStep();
        }

        if(step.type === "select"){
          return buildSelectField(step);
        }

        return buildInputField(step);
      }

      function isFilled(i){
        const step = steps[i];
        if(step.type === "review") return true;
        const k = step.key;
        return state[k] && String(state[k]).trim().length > 0;
      }

          function buildTracker(){
        tracker.innerHTML = "";

steps.slice(0, 9).forEach((s, idx) => {
          const cell = document.createElement("div");
          cell.className = "tCircleWrap";

          const mark = document.createElement("div");
          mark.className = "tCircleMark";
          mark.dataset.idx = String(idx);

          const c = document.createElement("div");
          c.className = "tCircle";
          c.textContent = String(idx + 1);
          c.dataset.idx = String(idx);

          const label = document.createElement("div");
          label.className = "tLabel";
          label.textContent = s.label;
          label.dataset.idx = String(idx);

          c.addEventListener("click", () => {
            const canGo =
              idx === current ||
              completed.has(idx) ||
              idx < current ||
              completed.has(idx - 1);

            if (!canGo) return;

            current = idx;
            finalSubmitted = false;
            finalMsg.classList.add("hidden");
            render();
          });

          cell.appendChild(mark);
          cell.appendChild(c);
          cell.appendChild(label);
          tracker.appendChild(cell);
        });
      }

     
      function updateTrackerUI(){
        const circles = tracker.querySelectorAll(".tCircle");
        const labels  = tracker.querySelectorAll(".tLabel");
        const marks   = tracker.querySelectorAll(".tCircleMark");

        circles.forEach((c) => {
          const idx = Number(c.dataset.idx);

          c.classList.remove("active", "done");

          if (completed.has(idx)) {
            c.classList.add("done");
          }

          if (idx === current) {
            c.classList.add("active");
          }
        });

        labels.forEach((l) => {
          const idx = Number(l.dataset.idx);

          l.classList.remove("hiddenLabel", "activeLabel");

          if (completed.has(idx) && idx !== current) {
            l.classList.add("hiddenLabel");
          } else if (idx === current) {
            l.classList.add("activeLabel");
          }
        });

        marks.forEach((m) => {
          const idx = Number(m.dataset.idx);

          m.classList.remove("show", "warn");
          m.innerHTML = "";

          if (!completed.has(idx)) return;

          if (idx === current) {
            m.classList.add("show", "warn");
            m.textContent = "!";
          } else {
            m.classList.add("show");
            m.innerHTML = `
              <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6L9 17l-5-5"/>
              </svg>
            `;
          }
        });
      }


      function getCompactSteps(currentIndex, total){
        const currentStep = currentIndex + 1;

        if (currentStep <= 3) return [1, 2, 3, "...", total];
        if (currentStep >= total - 2) return [1, "...", total - 2, total - 1, total];
        return [1, "...", currentStep, "...", total];
      }


      function buildMobileTracker(){
        mobileTracker.innerHTML = "";

        const outer = document.createElement("div");
        outer.className = "mTrackerOuter";

        const row = document.createElement("div");
        row.className = "mTrackerRow";

        const left = document.createElement("button");
        left.className = "mArrow";
        left.innerHTML = "&#8249;";
        left.disabled = current === 0;
        left.addEventListener("click", () => {
          if(current === 0) return;
          current--;
          finalSubmitted = false;
          finalMsg.classList.add("hidden");
          render();
        });

        const stepsWrap = document.createElement("div");
        stepsWrap.className = "mSteps";

const visible = getCompactSteps(current, 9);

        visible.forEach(item => {
          if(item === "..."){
            const dots = document.createElement("div");
            dots.className = "mStepEllipsis";
            dots.textContent = "...";
            stepsWrap.appendChild(dots);
            return;
          }

          const idx = item - 1;
          const bubble = document.createElement("button");
          bubble.className = "mStepBubble";

          if (completed.has(idx)) {
            bubble.classList.add("done");
          }

          if (idx === current) {
            bubble.classList.add("active");
          }

          if (completed.has(idx) && idx === current) {
            bubble.textContent = "!";
          } else if (completed.has(idx)) {
            bubble.innerHTML = `
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6L9 17l-5-5"/>
              </svg>
            `;
          } else {
            bubble.textContent = item;
          }

          const canGo =
            idx === current ||
            completed.has(idx) ||
            idx < current ||
            completed.has(idx - 1);

          if(!canGo){
            bubble.style.opacity = ".55";
            bubble.disabled = true;
          } else {
            bubble.addEventListener("click", () => {
              current = idx;
              finalSubmitted = false;
              finalMsg.classList.add("hidden");
              render();
            });
          }

          stepsWrap.appendChild(bubble);
        });

        const right = document.createElement("button");
        right.className = "mArrow";
        right.innerHTML = "&#8250;";
        right.disabled = current === steps.length - 1;
        right.addEventListener("click", () => {
          if(current === steps.length - 1) return;
          if(!isFilled(current)) return;
          completed.add(current);
          current++;
          render();
        });

        const label = document.createElement("div");
        label.className = "mStepLabel";
        label.textContent = steps[current].label.toUpperCase();

        row.appendChild(left);
        row.appendChild(stepsWrap);
        row.appendChild(right);

        outer.appendChild(row);
        outer.appendChild(label);

        mobileTracker.appendChild(outer);
      }



function renderStep(){
  const s = steps[current];
  const isReview = s.type === "review";
  const isPaymentStep = s.key === "paymentTerms";

  stepTitle.textContent = s.title;
  stepSubtitle.textContent = s.subtitle;
  stepIcon.src = isReview ? "rfq/step9.png" : `rfq/step${current + 1}.png`;
  stepIcon.alt = isReview ? "Review icon" : `Step ${current + 1} icon`;

  stepBody.innerHTML = "";
  stepBody.appendChild(makeField(s));

  backBtn.disabled = current === 0;

  if(isReview){
    document.getElementById("rfqTrackerWrapDesktop").classList.add("opacity-0", "pointer-events-none");
    document.getElementById("rfqTrackerWrapMobile").classList.add("opacity-0", "pointer-events-none");
    nextBtn.classList.add("hidden");
    submitWrap.classList.remove("hidden");
  } else {
    document.getElementById("rfqTrackerWrapDesktop").classList.remove("opacity-0", "pointer-events-none");
    document.getElementById("rfqTrackerWrapMobile").classList.remove("opacity-0", "pointer-events-none");
    nextBtn.classList.remove("hidden");
    submitWrap.classList.add("hidden");
    nextBtn.textContent = isPaymentStep ? "Review Order and Submit" : "Next →";
  }

  finalMsg.classList.toggle("hidden", !finalSubmitted);
}



      startBtn.addEventListener("click", () => {
        const n = (nameEl.value || "").trim();
        const e = (emailEl.value || "").trim();
        const p = (phoneEl.value || "").trim();

        if(!n || !e || !p) return;

        state.__name = n;
        state.__email = e;
        state.__phone = p;

document.getElementById("rfqSubtitle").textContent = "Structured procurement in 9 steps";

        step0Card.classList.add("hidden");
        wizardWrap.classList.remove("hidden");
        render();
      });

      nextBtn.addEventListener("click", () => {
  if(!isFilled(current)) return;

  completed.add(current);

  const isPaymentStep = steps[current].key === "paymentTerms";

  if(isPaymentStep){
    current = steps.length - 1; // jump to review
  } else if(current < 8){
    current++;
  }

  finalSubmitted = false;
  finalMsg.classList.add("hidden");
  render();
});

function resetRfqForm(){
  Object.keys(state).forEach((key) => delete state[key]);
  completed.clear();
  current = 0;
  finalSubmitted = false;

  nameEl.value = "";
  emailEl.value = "";
  phoneEl.value = "";

  document.getElementById("rfqSubtitle").textContent = "XXXXXXXXXXXXXXXXXXXXXxx";

  finalMsg.classList.add("hidden");
  wizardWrap.classList.add("hidden");
  step0Card.classList.remove("hidden");

  document.getElementById("rfqTrackerWrapDesktop").classList.remove("opacity-0", "pointer-events-none");
  document.getElementById("rfqTrackerWrapMobile").classList.remove("opacity-0", "pointer-events-none");

  render();
}

backBtn.addEventListener("click", () => {
  if(current === 0) return;

  if(steps[current].type === "review"){
    current = 8;
  } else {
    current--;
  }

  finalSubmitted = false;
  finalMsg.classList.add("hidden");
  render();
});

submitBtn.addEventListener("click", () => {
  finalSubmitted = true;

  finalMsg.innerHTML = `
    <div class="flex items-start gap-3">
      <div class="shrink-0 mt-0.5">
        <svg class="w-6 h-6 text-[#16a34a]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 6L9 17l-5-5" />
        </svg>
      </div>
      <div>
        <div class="font-semibold">We will contact you shortly regarding your order.</div>
      </div>
    </div>
  `;

  finalMsg.classList.remove("hidden");

  setTimeout(() => {
    resetRfqForm();
  }, 5000);
});



      function render(){
        renderStep();
        updateTrackerUI();
        buildMobileTracker();
      }

      buildTracker();
      render();
    })();
  </script>

  <script>
    (function () {
      const mobileMenuButton = document.getElementById('mobile-menu-button');
      const mobileMenu = document.getElementById('mobile-menu');
      const openIcon = document.getElementById('menu-open-icon');
      const closeIcon = document.getElementById('menu-close-icon');

      if (!mobileMenuButton || !mobileMenu) return;

      let scrollCloseTimer;

      function openMobileMenu() {
        mobileMenu.classList.remove('hidden');
        mobileMenuButton.setAttribute('aria-expanded', 'true');
        if (openIcon) openIcon.classList.add('hidden');
        if (closeIcon) closeIcon.classList.remove('hidden');
      }

      function closeMobileMenu() {
        mobileMenu.classList.add('hidden');
        mobileMenuButton.setAttribute('aria-expanded', 'false');
        if (openIcon) openIcon.classList.remove('hidden');
        if (closeIcon) closeIcon.classList.add('hidden');
      }

      function isMobileView() {
        return window.innerWidth < 768;
      }

      function toggleMobileMenu() {
        if (mobileMenu.classList.contains('hidden')) {
          openMobileMenu();
        } else {
          closeMobileMenu();
        }
      }

      mobileMenuButton.addEventListener('click', toggleMobileMenu);

      window.addEventListener(
        'scroll',
        function () {
          if (!isMobileView()) return;
          if (!mobileMenu.classList.contains('hidden')) closeMobileMenu();

          clearTimeout(scrollCloseTimer);
          scrollCloseTimer = setTimeout(() => {
            if (!isMobileView()) return;
            closeMobileMenu();
          }, 120);
        },
        { passive: true }
      );

      window.addEventListener('resize', function () {
        closeMobileMenu();
      });
    })();
  </script>
