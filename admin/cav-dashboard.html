<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shunah Internal Console | CAV</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
:root{--shunah-blue:#2F5DA8;--navy:#0B1A2D;--bg:#F6F8FB;--card:#fff;--border:#E5EAF1;--text-soft:#64748B;--green:#16A34A;--danger:#B91C1C}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--navy)}.admin-kicker{color:var(--shunah-blue);font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}h1{margin:0;font-size:34px;letter-spacing:-.04em}.admin-subtitle{margin-top:8px;color:var(--text-soft);font-size:15px}.btn{border:0;cursor:pointer;font-weight:900;border-radius:14px;padding:12px 18px}.btn-primary{background:var(--navy);color:#fff;box-shadow:0 12px 28px rgba(11,26,45,.16)}.btn-soft{background:#EEF3FA;color:var(--navy)}.shell{min-height:100vh;padding:28px}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat-card,.filters-card,.map-card,.table-card{background:var(--card);border:1px solid var(--border);box-shadow:0 10px 30px rgba(11,26,45,.05)}.stat-card{border-radius:22px;padding:18px}.stat-label{font-size:13px;color:var(--text-soft);margin-bottom:8px}.stat-value{font-size:28px;font-weight:900;letter-spacing:-.03em}.filters-card{border-radius:22px;padding:14px;margin-bottom:18px;display:grid;grid-template-columns:1fr 180px 180px 140px;gap:12px;align-items:center}.filter-input,.filter-select,.login-input{width:100%;border:1px solid var(--border);border-radius:14px;padding:12px 13px;font-size:14px;outline:none;background:white}.filter-input:focus,.filter-select:focus,.login-input:focus{border-color:var(--shunah-blue);box-shadow:0 0 0 4px rgba(47,93,168,.10)}.dashboard-grid{display:grid;grid-template-columns:.85fr 1.4fr;gap:18px;align-items:stretch}.map-card,.table-card{border-radius:26px;overflow:hidden}.card-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}.card-title{font-weight:900}.status{font-size:13px;color:var(--text-soft);white-space:nowrap}#map{width:100%;height:650px}.table-wrap{max-height:650px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:13px 14px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{color:var(--text-soft);font-size:12px;font-weight:900;background:#FAFBFD;position:sticky;top:0;z-index:2}tbody tr{cursor:pointer;transition:background .15s ease}tbody tr:hover{background:#F8FAFD}.crop-pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:rgba(47,93,168,.09);color:var(--shunah-blue);font-weight:900;font-size:12px}.coord-text{color:var(--text-soft);font-size:12px;margin-top:5px;line-height:1.35}.popup-title{font-weight:900;margin-bottom:6px;color:var(--navy)}.popup-line{margin:3px 0;font-size:13px}.popup-image{width:180px;height:120px;object-fit:cover;border-radius:12px;margin-bottom:8px;border:1px solid var(--border)}.popup-metrics{margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}.metric-line{font-size:12px;margin:2px 0}.empty-state{padding:22px;color:var(--text-soft);text-align:center;font-weight:700}@media(max-width:1050px){.stats-grid{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}}@media(max-width:700px){.shell{padding:18px}.header{flex-direction:column}.filters-card{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr}h1{font-size:28px}#map{height:520px}}
</style>
</head>
<body>
<main class="shell">
<header class="header"><div><div class="admin-kicker">Shunah Internal Console</div><h1>CAV Dashboard</h1><div class="admin-subtitle">Computer-aided vision inspection locations, images, metrics, crop, user, and GPS location.</div></div><div class="header-actions"><button class="btn btn-soft" onclick="location.href='login.html'">Switch System</button><button class="btn btn-primary" onclick="loadRecords()">Refresh Data</button><button class="btn btn-soft" onclick="signOutAdmin()">Logout</button></div></header>
<section class="stats-grid"><div class="stat-card"><div class="stat-label">Total Locations</div><div class="stat-value" id="totalRecords">—</div></div><div class="stat-card"><div class="stat-label">Today</div><div class="stat-value" id="todayRecords">—</div></div><div class="stat-card"><div class="stat-label">Latest Crop</div><div class="stat-value" id="latestCrop">—</div></div><div class="stat-card"><div class="stat-label">Latest User</div><div class="stat-value" id="latestUser">—</div></div></section>
<section class="filters-card"><input class="filter-input" id="searchFilter" type="text" placeholder="Search user, phone, crop, GPS..." oninput="applyFilters()"/><select class="filter-select" id="cropFilter" onchange="applyFilters()"><option value="">All crops</option></select><input class="filter-input" id="dateFilter" type="date" onchange="applyFilters()"/><button class="btn btn-soft" onclick="clearFilters()">Clear</button></section>
<section class="dashboard-grid"><div class="table-card"><div class="card-head"><div class="card-title">CAV Records</div><div class="status" id="tableStatus">—</div></div><div class="table-wrap"><table><thead><tr><th>Crop</th><th>User</th><th>Date</th><th>GPS</th></tr></thead><tbody id="recordsTable"></tbody></table></div></div><div class="map-card"><div class="card-head"><div class="card-title">Inspection Map</div><div class="status" id="mapStatus">Loading...</div></div><div id="map"></div></div></section>
</main>
<script>
const client=supabase.createClient("https://evnzrcubbgfirhrttpzb.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2bnpyY3ViYmdmaXJocnR0cHpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MzgyODMsImV4cCI6MjA5NDAxNDI4M30.BPHkIpxa2o2s-gVuStzo_7nUj_1g8VpiNPRVF1BMhnk");
let allItems=[],filteredItems=[],mapObjects=[];
const map=L.map("map").setView([26.8206,30.8025],6);L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{attribution:"Tiles &copy; Esri",maxZoom:19}).addTo(map);let markersLayer=L.layerGroup().addTo(map);

function formatDate(dateString){if(!dateString)return "—";return new Date(dateString).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function getDateOnly(dateString){if(!dateString)return "";return new Date(dateString).toISOString().split("T")[0]}
function isToday(dateString){if(!dateString)return false;const d=new Date(dateString),t=new Date();return d.getDate()===t.getDate()&&d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear()}
function safeText(value){if(value===null||value===undefined||value==="")return "—";return String(value)}
function getCrop(item){return item.crop||item.selected_crop||item.crop_name||item.crop_type||"—"}
function getUserName(item){return item.username||item.user_name||item.name||item.full_name||item.created_by||"—"}
function getPhone(item){return item.user_phone||item.phone||item.mobile||item.user_mobile||"—"}
function getCreatedAt(item){return item.created_at||item.inserted_at||item.saved_at||item.date||item.createdAt||null}
function toNumber(value){const n=Number(value);return Number.isFinite(n)?n:null}
function renderMetrics(metrics){if(!metrics)return "";let parsed=metrics;if(typeof metrics==="string"){try{parsed=JSON.parse(metrics)}catch{return ""}}if(typeof parsed!=="object")return "";const rows=Object.entries(parsed).slice(0,8).map(([k,v])=>`<div class="metric-line"><b>${k}:</b> ${v}</div>`).join("");return rows?`<div class="popup-metrics"><div class="popup-line"><b>Metrics</b></div>${rows}</div>`:""}
function buildCropFilter(items){const cropFilter=document.getElementById("cropFilter");const current=cropFilter.value;const crops=[...new Set(items.map(getCrop).filter(c=>c&&c!=="—"))];cropFilter.innerHTML='<option value="">All crops</option>';crops.forEach(c=>cropFilter.innerHTML+=`<option value="${c}">${c}</option>`);cropFilter.value=current}
function clearFilters(){document.getElementById("searchFilter").value="";document.getElementById("cropFilter").value="";document.getElementById("dateFilter").value="";filteredItems=[...allItems];renderDashboard(filteredItems)}
function renderStats(items){const todayCount=items.filter(i=>isToday(getCreatedAt(i))).length;const latest=items[0]||{};document.getElementById("totalRecords").textContent=items.length;document.getElementById("todayRecords").textContent=todayCount;document.getElementById("latestCrop").textContent=getCrop(latest);document.getElementById("latestUser").textContent=getUserName(latest)!=="—"?getUserName(latest):getPhone(latest)}
async function signOutAdmin(){await client.auth.signOut();location.href="login.html"}
async function requireSession(){const {data}=await client.auth.getSession();if(!data.session)location.href="login.html"}

function getPoint(item){const lat=toNumber(item.latitude||item.lat||item.location_latitude);const lng=toNumber(item.longitude||item.lng||item.lon||item.location_longitude);if(lat===null||lng===null)return null;return [lat,lng]}
function getCoordinatesText(item){const point=getPoint(item);return point?`${point[0]}, ${point[1]}`:"—"}
function buildPopup(item,coordinatesText){const imageUrl=item.image_url||item.photo_url||"";const imageHtml=imageUrl?`<img class="popup-image" src="${imageUrl}" alt="Record image" />`:"";const accuracy=item.location_accuracy||item.accuracy||"—";return `<div>${imageHtml}<div class="popup-title">Shunah CAV Inspection</div><div class="popup-line"><b>User:</b> ${safeText(getUserName(item))}</div><div class="popup-line"><b>Phone:</b> ${safeText(getPhone(item))}</div><div class="popup-line"><b>Crop:</b> ${safeText(getCrop(item))}</div><div class="popup-line"><b>Date:</b> ${safeText(formatDate(getCreatedAt(item)))}</div><div class="popup-line"><b>Accuracy:</b> ${safeText(accuracy)} m</div><div class="popup-line"><b>GPS:</b> ${safeText(coordinatesText)}</div>${renderMetrics(item.metrics)}</div>`}
async function loadRecords(){markersLayer.clearLayers();mapObjects=[];document.getElementById("mapStatus").textContent="Loading...";document.getElementById("tableStatus").textContent="Loading...";const {data,error}=await client.from("cav_inspections").select("*").order("created_at",{ascending:false});if(error){console.error(error);document.getElementById("mapStatus").textContent="Could not load cav_inspections";document.getElementById("tableStatus").textContent="Error";document.getElementById("recordsTable").innerHTML='<tr><td colspan="4"><div class="empty-state">Could not load cav_inspections. Check table name and Supabase policies.</div></td></tr>';return}allItems=data||[];filteredItems=[...allItems];buildCropFilter(allItems);renderDashboard(filteredItems)}
function applyFilters(){const searchValue=document.getElementById("searchFilter").value.toLowerCase().trim();const cropValue=document.getElementById("cropFilter").value;const dateValue=document.getElementById("dateFilter").value;filteredItems=allItems.filter(item=>{const searchText=`${getCrop(item)} ${getUserName(item)} ${getPhone(item)} ${getCoordinatesText(item)}`.toLowerCase();return (!searchValue||searchText.includes(searchValue))&&(!cropValue||getCrop(item)===cropValue)&&(!dateValue||getDateOnly(getCreatedAt(item))===dateValue)});renderDashboard(filteredItems)}
function renderDashboard(items){markersLayer.clearLayers();mapObjects=[];const boundsPoints=[];items.forEach((item,index)=>{const point=getPoint(item);if(!point)return;boundsPoints.push(point);const marker=L.marker(point).bindPopup(buildPopup(item,`${point[0]}, ${point[1]}`)).addTo(markersLayer);mapObjects[index]=marker});if(boundsPoints.length>0)map.fitBounds(boundsPoints,{padding:[40,40],maxZoom:13});else map.setView([26.8206,30.8025],6);renderStats(items);renderTable(items);document.getElementById("mapStatus").textContent=`${items.length} locations loaded`;document.getElementById("tableStatus").textContent=`${items.length} records`}
function openMapObject(index){const object=mapObjects[index];if(!object)return;if(object.getLatLng)map.setView(object.getLatLng(),15);object.openPopup()}
function renderTable(items){const tbody=document.getElementById("recordsTable");if(!items.length){tbody.innerHTML='<tr><td colspan="4"><div class="empty-state">No records found.</div></td></tr>';return}tbody.innerHTML=items.slice(0,500).map((item,index)=>`<tr onmouseenter="openMapObject(${index})" onclick="openMapObject(${index})"><td><span class="crop-pill">${safeText(getCrop(item))}</span></td><td><div><b>${safeText(getUserName(item))}</b></div><div style="color:#64748B;margin-top:3px;">${safeText(getPhone(item))}</div></td><td>${safeText(formatDate(getCreatedAt(item)))}</td><td><div class="coord-text">${safeText(getCoordinatesText(item))}</div></td></tr>`).join("")}
requireSession().then(loadRecords);
</script>
</body></html>
