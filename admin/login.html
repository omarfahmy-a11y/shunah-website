<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shunah Internal Console | Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    
:root{--shunah-blue:#2F5DA8;--navy:#0B1A2D;--bg:#F6F8FB;--card:#fff;--border:#E5EAF1;--text-soft:#64748B;--green:#16A34A;--danger:#B91C1C}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--navy)}.admin-kicker{color:var(--shunah-blue);font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}h1{margin:0;font-size:34px;letter-spacing:-.04em}.admin-subtitle{margin-top:8px;color:var(--text-soft);font-size:15px}.btn{border:0;cursor:pointer;font-weight:900;border-radius:14px;padding:12px 18px}.btn-primary{background:var(--navy);color:#fff;box-shadow:0 12px 28px rgba(11,26,45,.16)}.btn-soft{background:#EEF3FA;color:var(--navy)}.shell{min-height:100vh;padding:28px}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat-card,.filters-card,.map-card,.table-card{background:var(--card);border:1px solid var(--border);box-shadow:0 10px 30px rgba(11,26,45,.05)}.stat-card{border-radius:22px;padding:18px}.stat-label{font-size:13px;color:var(--text-soft);margin-bottom:8px}.stat-value{font-size:28px;font-weight:900;letter-spacing:-.03em}.filters-card{border-radius:22px;padding:14px;margin-bottom:18px;display:grid;grid-template-columns:1fr 180px 180px 140px;gap:12px;align-items:center}.filter-input,.filter-select,.login-input{width:100%;border:1px solid var(--border);border-radius:14px;padding:12px 13px;font-size:14px;outline:none;background:white}.filter-input:focus,.filter-select:focus,.login-input:focus{border-color:var(--shunah-blue);box-shadow:0 0 0 4px rgba(47,93,168,.10)}.dashboard-grid{display:grid;grid-template-columns:.85fr 1.4fr;gap:18px;align-items:stretch}.map-card,.table-card{border-radius:26px;overflow:hidden}.card-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}.card-title{font-weight:900}.status{font-size:13px;color:var(--text-soft);white-space:nowrap}#map{width:100%;height:650px}.table-wrap{max-height:650px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:13px 14px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{color:var(--text-soft);font-size:12px;font-weight:900;background:#FAFBFD;position:sticky;top:0;z-index:2}tbody tr{cursor:pointer;transition:background .15s ease}tbody tr:hover{background:#F8FAFD}.crop-pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:rgba(47,93,168,.09);color:var(--shunah-blue);font-weight:900;font-size:12px}.coord-text{color:var(--text-soft);font-size:12px;margin-top:5px;line-height:1.35}.popup-title{font-weight:900;margin-bottom:6px;color:var(--navy)}.popup-line{margin:3px 0;font-size:13px}.popup-image{width:180px;height:120px;object-fit:cover;border-radius:12px;margin-bottom:8px;border:1px solid var(--border)}.popup-metrics{margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}.metric-line{font-size:12px;margin:2px 0}.empty-state{padding:22px;color:var(--text-soft);text-align:center;font-weight:700}@media(max-width:1050px){.stats-grid{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}}@media(max-width:700px){.shell{padding:18px}.header{flex-direction:column}.filters-card{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr}h1{font-size:28px}#map{height:520px}}

    body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:#F3F5F8;
}

.login-card{
  width:100%;
  max-width:520px;
  background:white;
  border:1px solid rgba(229,234,241,.9);
  border-radius:28px;
  padding:46px 44px 34px;
  box-shadow:0 28px 80px rgba(11,26,45,.13);
}

.logo-wrap{
  display:flex;
  justify-content:center;
  margin-bottom:22px;
}

.login-logo{
  width:74px;
  height:auto;
  object-fit:contain;
}

.login-card h1{
  text-align:center;
  font-size:30px;
  line-height:1.15;
  letter-spacing:-.04em;
  margin:0;
}

.login-subtitle{
  text-align:center;
  color:#64748B;
  font-size:16px;
  margin:12px 0 34px;
  line-height:1.5;
}

.input-label{
  display:block;
  font-size:15px;
  font-weight:800;
  color:var(--navy);
  margin:0 0 10px;
}

.input-group{
  margin-bottom:22px;
}

.password-wrap{
  position:relative;
}

.input-wrap{
  position:relative;
}

.input-icon{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  width:22px;
  height:22px;
  color:#73839B;
  pointer-events:none;
}

.input-icon svg{
  width:22px;
  height:22px;
  stroke-width:1.9;
}

.login-form{
  display:block;
}

.login-card.logged-in .login-form{
  display:none;
}

.login-card.logged-in .login-subtitle{
  margin-bottom:26px;
}

.login-card.logged-in h1{
  font-size:28px;
}

.login-input{
  width:100%;
  height:58px;
  border:1px solid #CBD5E1;
  border-radius:12px;
  padding:0 48px 0 52px;
  font-size:15px;
  outline:none;
  background:white;
  color:var(--navy);
  margin:0;
}

.login-input::placeholder{
  color:#8190A8;
}

.login-input:focus{
  border-color:var(--shunah-blue);
  box-shadow:0 0 0 4px rgba(47,93,168,.10);
}

.eye-btn{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  width:30px;
  height:30px;
  border:0;
  background:transparent;
  cursor:pointer;
  color:#70809A;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}

.eye-btn svg{
  width:21px;
  height:21px;
  stroke-width:2;
}

.btn-primary{
  width:100%;
  height:58px;
  background:var(--shunah-blue);
  color:white;
  font-size:16px;
  font-weight:500;
  border-radius:12px;
  box-shadow:0 14px 28px rgba(47,93,168,.22);
}

.login-error{
  display:none;
  color:var(--danger);
  background:#FEF2F2;
  border:1px solid #FECACA;
  padding:11px 13px;
  border-radius:12px;
  font-size:13px;
  margin-top:14px;
  font-weight:800;
}

.choice{
  display:none;
}

body.dashboard-mode{
  padding:0;
  align-items:flex-start;
  justify-content:flex-start;
  overflow:hidden;
  background:#F5F8FC;
}

.login-card.logged-in{
  max-width:none;
  width:100%;
  min-height:100vh;
  border:0;
  border-radius:0;
  padding:0;
  box-shadow:none;
  background:#F5F8FC;
}

.login-card.logged-in .logo-wrap,
.login-card.logged-in #loginTitle,
.login-card.logged-in #loginSubtitle{
  display:none;
}

.dashboard-choice-page{
  min-height:100vh;
  width:100%;
  background:
    radial-gradient(circle at 10% 12%, rgba(47,93,168,.08), transparent 30%),
    radial-gradient(circle at 85% 85%, rgba(47,93,168,.08), transparent 34%),
    linear-gradient(135deg,#F8FBFF 0%,#EEF4FB 100%);
}

.choice-topbar{
  height:58px;
  background:#071A3A;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 clamp(18px,3vw,38px);
  box-shadow:0 18px 40px rgba(7,26,58,.18);
}

.choice-brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:16px;
  font-weight:900;
}

.choice-logo{
  width:32px;
  height:32px;
  object-fit:contain;
}

.choice-user-area{
  display:flex;
  align-items:center;
  gap:28px;
}

.choice-user{
  display:flex;
  align-items:center;
  gap:14px;
  padding-right:28px;
  border-right:1px solid rgba(255,255,255,.22);
}

.choice-avatar{
  width:42px;
  height:42px;
  border-radius:999px;
  background:linear-gradient(180deg,#D9E2F2,#FFFFFF);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#071A3A;
}

.choice-avatar svg{
  width:26px;
  height:26px;
}

.choice-user-name{
  font-size:14px;
  font-weight:900;
}

.choice-user-role{
  margin-top:3px;
  font-size:12px;
  color:rgba(255,255,255,.78);
  font-weight:500;
}

.logout-btn{
  border:0;
  background:transparent;
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
}

.logout-btn svg{
  width:22px;
  height:22px;
}

.choice-content{
  width:min(1320px, calc(100% - 34px));
  margin:0 auto;
  padding:26px 0 22px;
}

.choice-heading{
  text-align:center;
  margin-bottom:24px;
}

.choice-grid-icon{
  width:36px;
  height:36px;
  margin:0 auto 12px;
  color:#4176F6;
}
.choice-heading h2{
  margin:0;
  color:#071A3A;
  font-size:clamp(22px,2.2vw,30px);
  line-height:1.1;
  letter-spacing:-.045em;
}

.choice-heading p{
  margin:8px 0 0;
  color:#53627D;
  font-size:clamp(12px,1vw,14px);
}

.dashboard-grid-choice{
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:18px;
}

.choice-card{
  position:relative;
  min-height:190px;
  text-align:left;
  padding:0px 26px 24px;
  border-radius:22px;
  border:1px solid rgba(226,232,240,.95);
  background:rgba(255,255,255,.94);
  box-shadow:0 18px 45px rgba(11,26,45,.08);
  cursor:pointer;
  color:#071A3A;
  transition:.22s ease;
  overflow:hidden;
}

.choice-card::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:3px;
  background:var(--card-color);
}

.choice-card:hover{
  transform:translateY(-4px);
  box-shadow:0 30px 70px rgba(11,26,45,.14);
}

.choice-card.dummy{
  cursor:not-allowed;
  opacity:.96;
}

.card-inner{
  display:grid;
  grid-template-columns:74px 1fr;
  gap:20px;
  align-items:start;
padding-top:0;
}

.card-icon-box{
  width:62px;
  height:62px;
  border-radius:18px;
  background:var(--card-soft);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--card-color);
}

.card-icon-box svg{
  width:32px;
  height:32px;
  stroke-width:1.9;
}

.card-title{
  font-size:18px;
  font-weight:900;
  letter-spacing:-.03em;
  margin-top:0px;
}

.card-desc{
  display:block;
  margin-top:8px;
  color:#53627D;
  font-size:12px;
  line-height:1.5;
  font-weight:500;
}
.card-arrow{
  position:absolute;
  right:20px;
  bottom:18px;
  width:48px;
  height:40px;
  border-radius:999px;
  background:var(--card-soft);
  color:var(--card-color);
  display:flex;
  align-items:center;
  justify-content:center;
}

.card-arrow svg{
  width:25px;
  height:25px;
  stroke-width:2.4;
}

.choice-card.blue{
  --card-color:#4176F6;
  --card-soft:#EEF4FF;
}

.choice-card.green{
  --card-color:#48AE7C;
  --card-soft:#EAF8F1;
}

.choice-card.purple{
  --card-color:#8B5CF6;
  --card-soft:#F2EDFF;
}

.choice-card.orange{
  --card-color:#F59A2F;
  --card-soft:#FFF2E1;
}

.choice-card.steel{
  --card-color:#347DA8;
  --card-soft:#EAF5FA;
}

@media(max-width:1100px){
  .dashboard-grid-choice{
    grid-template-columns:repeat(2, minmax(0,1fr));
  }
}

@media(max-width:760px){
  .choice-topbar{
    height:auto;
    min-height:82px;
    padding:16px 20px;
    gap:14px;
  }

body.dashboard-mode{
  overflow:auto;
}
  .choice-brand{
    font-size:18px;
    gap:12px;
  }

  .choice-logo{
    width:38px;
    height:38px;
  }

  .choice-user{
    display:none;
  }

  .logout-btn span{
    display:none;
  }

  .choice-content{
    width:calc(100% - 28px);
    padding:38px 0 44px;
  }

  .choice-heading{
    margin-bottom:30px;
  }

  .dashboard-grid-choice{
    grid-template-columns:1fr;
    gap:18px;
  }

  .choice-card{
    min-height:178px;
    padding:24px;
  }

  .card-inner{
    grid-template-columns:76px 1fr;
    gap:18px;
  }

  .card-icon-box{
    width:72px;
    height:72px;
    border-radius:18px;
  }

  .card-icon-box svg{
    width:38px;
    height:38px;
  }

  .card-title{
    margin-top:10px;
    font-size:21px;
  }

  .card-desc{
    font-size:14px;
    margin-top:10px;
  }

  .card-arrow{
    width:50px;
    height:42px;
    right:18px;
    bottom:18px;
  }
}
@media(max-width:600px){
  .login-card{
    max-width:100%;
    padding:36px 24px 28px;
  }
}
  </style>
</head>
<body>
  <main class="login-card" id="loginCard">
  <div class="logo-wrap">
    <img class="login-logo" src="shunah-logo.png" alt="Shunah Logo" />
  </div>

  <h1 id="loginTitle">Admin Login</h1>
  <div class="login-subtitle" id="loginSubtitle">Welcome Back!, Please Sign In</div>

  <section class="login-form" id="loginForm">
    <div class="input-group">
      <label class="input-label" for="email">Email</label>

      <div class="input-wrap">
        <span class="input-icon">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path d="M12 12.25a4.25 4.25 0 1 0 0-8.5 4.25 4.25 0 0 0 0 8.5Z"/>
            <path d="M4.75 20.25c.85-3.35 3.55-5.25 7.25-5.25s6.4 1.9 7.25 5.25"/>
          </svg>
        </span>

        <input class="login-input" id="email" type="email" placeholder="Enter your email" autocomplete="email" />
      </div>
    </div>

    <div class="input-group">
      <label class="input-label" for="password">Password</label>

      <div class="password-wrap input-wrap">
        <span class="input-icon">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path d="M7.25 10.25V8a4.75 4.75 0 0 1 9.5 0v2.25"/>
            <path d="M6.75 10.25h10.5c1.1 0 2 .9 2 2v6.25c0 1.1-.9 2-2 2H6.75c-1.1 0-2-.9-2-2v-6.25c0-1.1.9-2 2-2Z"/>
            <path d="M12 14.25v2.5"/>
          </svg>
        </span>

        <input class="login-input" id="password" type="password" placeholder="Enter your password" autocomplete="current-password" onkeydown="if(event.key==='Enter') signInAdmin()" />

        <button class="eye-btn" type="button" onclick="togglePassword()" aria-label="Show password">
          <svg id="eyeIcon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path d="M2.25 12s3.75-6.75 9.75-6.75S21.75 12 21.75 12 18 18.75 12 18.75 2.25 12 2.25 12Z"/>
            <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn btn-primary" onclick="signInAdmin()">Sign In</button>

    <div class="login-error" id="errorBox">Please enter your email and password.</div>
  </section>

  <section class="choice" id="choiceBox">
  <div class="dashboard-choice-page">
    <header class="choice-topbar">
      <div class="choice-brand">
        <img class="choice-logo" src="shunah-logo.png" alt="Shunah Logo" />
        <span>Shunah Admin</span>
      </div>

      <div class="choice-user-area">
        <div class="choice-user">
          <div class="choice-avatar">
            <svg fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 12.25a4.75 4.75 0 1 0 0-9.5 4.75 4.75 0 0 0 0 9.5Z"/>
              <path d="M3.75 21c1.05-4.2 4.05-6.45 8.25-6.45S19.2 16.8 20.25 21H3.75Z"/>
            </svg>
          </div>

          <div>
            <div class="choice-user-name">Admin Shunah</div>
            <div class="choice-user-role">Super Admin</div>
          </div>
        </div>

        <button class="logout-btn" type="button" onclick="signOutAdmin()">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path d="M15.75 8.75V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-2.25"/>
            <path d="M10.75 12h9"/>
            <path d="M16.75 8.25 20.5 12l-3.75 3.75"/>
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </header>

    <main class="choice-content">
      <div class="choice-heading">
        <svg class="choice-grid-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path d="M4.75 4.75h5.5v5.5h-5.5z"/>
          <path d="M13.75 4.75h5.5v5.5h-5.5z"/>
          <path d="M4.75 13.75h5.5v5.5h-5.5z"/>
          <path d="M13.75 13.75h5.5v5.5h-5.5z"/>
        </svg>

        <h2>Which dashboard do you want to access?</h2>
        <p>Select a dashboard below to view and manage data.</p>
      </div>

      <div class="dashboard-grid-choice">
        <button class="choice-card blue" onclick="location.href='rci-dashboard.html'">
          <div class="card-inner">
            <div class="card-icon-box">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path d="M5.5 19V12.5"/>
                <path d="M12 19V8.5"/>
                <path d="M18.5 19V5"/>
              </svg>
            </div>

            <div>
              <div class="card-title">RCI Dashboard</div>
              <span class="card-desc">Coordinate collection, crop targets, and field progress.</span>
            </div>
          </div>

          <div class="card-arrow">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path d="M5 12h14"/>
              <path d="m13 6 6 6-6 6"/>
            </svg>
          </div>
        </button>

        <button class="choice-card green" onclick="location.href='cav-dashboard.html'">
          <div class="card-inner">
            <div class="card-icon-box">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path d="M5 19C15.5 18.5 20 12.5 20.5 4.5 12.5 5 6.5 9.5 5 19Z"/>
                <path d="M5 19c3.4-5.2 7.4-7.9 12-9.5"/>
              </svg>
            </div>

            <div>
              <div class="card-title">CAV Dashboard</div>
              <span class="card-desc">Crop image analysis, quality records, and model results.</span>
            </div>
          </div>

          <div class="card-arrow">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path d="M5 12h14"/>
              <path d="m13 6 6 6-6 6"/>
            </svg>
          </div>
        </button>

        <button class="choice-card purple dummy" type="button">
          <div class="card-inner">
            <div class="card-icon-box">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <circle cx="12" cy="12" r="7"/>
                <circle cx="12" cy="12" r="3"/>
                <path d="M16.5 7.5 20 4"/>
                <path d="M17.5 4H20v2.5"/>
              </svg>
            </div>

            <div>
              <div class="card-title">Targets Dashboard</div>
              <span class="card-desc">Crop targets, feddan progress, and employee performance.</span>
            </div>
          </div>

          <div class="card-arrow">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path d="M5 12h14"/>
              <path d="m13 6 6 6-6 6"/>
            </svg>
          </div>
        </button>

        <button class="choice-card orange dummy" type="button">
          <div class="card-inner">
            <div class="card-icon-box">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path d="M3.5 7.5h10v8h-10z"/>
                <path d="M13.5 10h3.5l3.5 3.5v2h-7"/>
                <circle cx="7" cy="17.5" r="1.7"/>
                <circle cx="17" cy="17.5" r="1.7"/>
              </svg>
            </div>

            <div>
              <div class="card-title">Supply Dashboard</div>
              <span class="card-desc">Suppliers, crop flow, quantities, and regions.</span>
            </div>

async function signInAdmin(){
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');

  const password = passwordInput.value;
  const errorBox = document.getElementById('errorBox');
  const choiceBox = document.getElementById('choiceBox');

  errorBox.style.display = 'none';
  choiceBox.style.display = 'none';

  if(!email || !password){
    errorBox.textContent = 'Please enter your email and password.';
    errorBox.style.display = 'block';
    return;
  }

  const { error: cavError } = await cavClient.auth.signInWithPassword({

    password
  });

  if(cavError){
    errorBox.textContent = 'Login failed. Check your email and password.';
    errorBox.style.display = 'block';
    return;
  }

  });

    errorBox.style.display = 'block';
    return;
  }

}
